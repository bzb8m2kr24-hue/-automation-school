round:#f0f1f6;color:#5e6476;font-size:12px}.btn{border:0;border-radius:11px;background:var(--a);color:#fff;padding:11px 15px;font-weight:800}.btn.secondary{background:var(--a2);color:var(--a)}.btn.ghost{background:#f1f2f6;color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.module{position:relative}.module h3{margin:9px 0 5px}.module .num{position:absolute;right:14px;top:14px;color:#c9c4ff;font-weight:900}.locked{opacity:.55}.lesson{max-width:850px}.lesson h2{font-size:38px;line-height:1.1}.lesson h3{margin-top:28px}.concept{background:#faf9ff;border:1px solid #dfdbff;border-left:4px solid var(--a);padding:15px;border-radius:12px}.warning{background:#fff8e8;border:1px solid #f0d99b;padding:15px;border-radius:12px}.visual{margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fafaff}.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.box{padding:11px 13px;background:var(--a2);border:1px solid #ddd7ff;color:#5546c8;border-radius:11px;font-weight:800}.arrow{font-size:21px;color:var(--a)}.caption{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}.quiz,.open{margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fbfbfe}.opt{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;margin:7px 0}.opt:hover{border-color:var(--a)}.opt.good{border-color:var(--good);background:#effaf5}.opt.bad{border-color:var(--bad);background:#fff1f3}.feedback{margin-top:9px;font-weight:700}.open textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:11px;padding:12px;resize:vertical}.score{font-weight:900;font-size:22px}.side{display:grid;grid-template-columns:240px 1fr;gap:18px}.toc{height:max-content;position:sticky;top:85px}.toc button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:9px;color:var(--muted)}.toc button:hover{background:var(--a2);color:var(--a)}.term{padding:13px 0;border-bottom:1px solid var(--line)}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:left}.footer{color:var(--muted);font-size:13px;margin-top:35px}.hide{display:none!important}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.side{grid-template-columns:1fr}.toc{position:static}.navlinks button{font-size:12px;padding:8px}.lesson h2{font-size:30px}}@media(max-width:480px){.stats{grid-template-columns:1fr}.hero{padding:22px}}
</style></head><body><header class="top"><nav class="nav"><div class="logo">⚡ Automation <b>School</b></div><div class="navlinks"><button data-p="home">Accueil</button><button data-p="course">Parcours</button><button data-p="practice">Pratique</button><button data-p="business">Business</button><button data-p="glossary">Glossaire</button><button data-p="resources">Ressources</button></div></nav></header><main id="app"></main><footer class="footer" style="max-width:1180px;margin:0 auto;padding:0 18px 50px">Automation School · parcours personnel · contenu original inspiré des bonnes pratiques pédagogiques du secteur, sans reproduire les contenus propriétaires des plateformes.</footer><script>
const KEY='as_v2';let S=JSON.parse(localStorage.getItem(KEY)||'{"done":[],"xp":0,"answers":{},"notes":""}');const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const mods=[
['01','Fondations de l’automatisation','Débutant','Comprendre le métier avant de toucher aux outils.',['Automatisation vs IA','Workflow, trigger et action','Processus métier','Input, output et données','Quand automatiser ?','Cartographier un processus']],
['02','n8n de zéro','Débutant','Apprendre à construire des workflows simples et propres.',['Interface et nodes','Premier workflow','Données entre nodes','Expressions et mapping','Tests et debugging','Projet : formulaire → CRM']],
['03','Make de zéro','Débutant','Comprendre l’approche no-code et les scénarios.',['Interface et scénarios','Modules et mapping','Filtres et routers','Scheduling et opérations','Erreurs et reprises','Projet : lead → suivi']],
['04','Technique essentielle','Intermédiaire','API, HTTP, JSON, webhooks, auth et bases de données.',['API : comprendre une requête','HTTP et méthodes','JSON en pratique','Webhooks','API keys, OAuth et sécurité','Bases de données et CRUD']],
['05','IA générative','Intermédiaire','LLM, prompting, sorties structurées, extraction et évaluation.',['LLM et tokens','Prompt engineering','Contexte et limites','Classification et extraction','Structured outputs','Évaluer une réponse IA']],
['06','Agents IA & systèmes','Avancé','Comprendre agents, outils, mémoire, RAG et contrôle humain.',['Workflow vs agent','Tool calling','Mémoire et contexte','RAG','Guardrails et human-in-the-loop','Production : coût, sécurité, fiabilité']],
['07','Systèmes métier','Avancé','Transformer les briques techniques en solutions vendables.',['Lead management','Support client','Reporting automatique','Documents et extraction','Rendez-vous et relances','Monitoring et maintenance']],
['08','Trouver une niche','Business','Chercher un marché par problème, pas par effet de mode.',['Niche : définition utile','Détecter les douleurs','Évaluer une niche','Interviews et découverte','Choisir son premier terrain','Étude de cas multi-niches']],
['09','Créer son offre','Business','Passer d’une compétence à une offre claire et rentable.',['Résultat vs outil','MVP et démonstration','Audit d’automatisation','Tarification','Proposition commerciale','Livraison et récurrence']],
['10','Prospection & vente','Business','Trouver, contacter, qualifier et convertir des prospects.',['Construire une liste','Personnaliser son approche','Email et LinkedIn','Appel découverte','Démo et objections','Closing et suivi']],
['11','Projet client complet','Projet','Construire un système de A à Z avec cahier des charges.',['Cadrage','Cartographie','Architecture','Construction V1','Tests et sécurité','Présentation client']],
['12','Évaluation finale','Certification interne','Valider que tu sais raisonner comme un automatisateur IA.',['Diagnostic d’entreprise','Choix de solution','Architecture complète','Analyse ROI','Pitch de l’offre','Grand cas final']]
];
const detail={
'Automatisation vs IA':`<p>L’automatisation exécute une logique définie. L’IA apporte surtout de l’interprétation, de la génération ou de la décision probabiliste.</p><div class="concept"><b>Règle :</b> si une condition simple suffit, préfère une règle. Utilise l’IA quand le problème contient du langage, des documents, de l’ambiguïté ou une décision difficile à coder.</div>`,
'Workflow, trigger et action':`<p>Un workflow est une chaîne. Le trigger le démarre. Les actions transforment ou déplacent les données. Une bonne automatisation décrit toujours son entrée, son traitement et son résultat.</p><div class="visual"><div class="flow"><span class="box">Événement</span><span class="arrow">→</span><span class="box">Traitement</span><span class="arrow">→</span><span class="box">Action</span><span class="arrow">→</span><span class="box">Résultat</span></div><div class="caption">Le schéma mental à retenir pour presque tous les workflows.</div></div>`,
'API : comprendre une requête':`<p>Une API est un contrat de communication entre logiciels. Une requête contient généralement une URL, une méthode HTTP, des en-têtes et parfois un corps. La réponse contient un statut et des données.</p><div class="visual"><div class="flow"><span class="box">n8n / Make</span><span class="arrow">→ requête</span><span class="box">API</span><span class="arrow">→ réponse</span><span class="box">Données</span></div></div><p>Tu dois savoir lire une documentation API, repérer l’endpoint, la méthode, l’authentification et le format de réponse.</p>`,
'HTTP et méthodes':`<p>GET sert généralement à lire, POST à créer ou déclencher, PUT/PATCH à modifier et DELETE à supprimer. Les codes HTTP sont aussi importants : 2xx indique généralement un succès, 4xx une requête à corriger, 5xx un problème côté serveur.</p>`,
'JSON en pratique':`<p>JSON représente des objets, listes, chaînes, nombres, booléens et valeurs nulles. Dans un workflow, savoir lire la structure est essentiel pour récupérer le bon champ.</p><div class="concept"><code>{"nom":"Emma","budget":1200,"urgent":true}</code><br>Tu peux lire : nom = Emma, budget = 1200, urgent = oui.</div>`,
'Webhooks':`<p>Un webhook permet à un service d’envoyer un événement à une URL. Il évite souvent de demander en boucle « est-ce qu’il y a du nouveau ? ».</p><div class="visual"><div class="flow"><span class="box">Événement</span><span class="arrow">→</span><span class="box">Webhook URL</span><span class="arrow">→</span><span class="box">Workflow</span></div></div>`,
'LLM et tokens':`<p>Un LLM prédit des suites de tokens à partir d’un contexte. Il peut produire du texte, mais son fonctionnement probabiliste implique des erreurs et des hallucinations possibles.</p><p>Comprends surtout : contexte, fenêtre de contexte, coût, latence, température selon l’outil, et limites de connaissance ou de données disponibles.</p>`,
'Prompt engineering':`<p>Un prompt utile précise le rôle, l’objectif, les données disponibles, les contraintes et le format de sortie attendu. Pour une automatisation, demande souvent une sortie structurée plutôt qu’un paragraphe libre.</p><div class="concept"><b>Structure :</b> rôle → tâche → contexte → contraintes → format attendu → exemples si nécessaire.</div>`,
'Workflow vs agent':`<p>Un workflow suit une architecture prévue. Un agent peut choisir des outils et des étapes pour atteindre un objectif. L’agent apporte de la flexibilité mais aussi plus d’incertitude, de coût et de surface de risque.</p><div class="warning"><b>Question réflexe :</b> « Est-ce que j’ai vraiment besoin que le système décide ? »</div>`,
'Tool calling':`<p>Le tool calling permet à un modèle de demander l’exécution d’une fonction ou d’un outil. Le système doit ensuite exécuter l’action, contrôler le résultat et éventuellement renvoyer ce résultat au modèle.</p>`,
'RAG':`<p>Le RAG consiste à récupérer des informations pertinentes avant de demander au modèle de répondre. Il est utile quand les connaissances doivent venir de documents ou données métier.</p><div class="visual"><div class="flow"><span class="box">Question</span><span class="arrow">→</span><span class="box">Recherche</span><span class="arrow">→</span><span class="box">Contexte</span><span class="arrow">→</span><span class="box">LLM</span><span class="arrow">→</span><span class="box">Réponse</span></div></div>`,
'Lead management':`<p>Une solution commerciale peut capter un lead, vérifier ses données, le qualifier, le créer dans le CRM, notifier un commercial et lancer un suivi. Chaque étape doit avoir une règle d’arrêt et un traitement d’erreur.</p>`,
'Niche : définition utile':`<p>Une niche n’est pas une catégorie magique. C’est un terrain où tu peux comprendre rapidement les processus, les douleurs et les décideurs. Commence avec quelques niches comparables et teste-les.</p>`,
'Détecter les douleurs':`<p>Cherche les tâches fréquentes, manuelles, répétitives, mesurables et suffisamment coûteuses. Questions utiles : combien de fois ? combien de temps ? quelles erreurs ? quel impact commercial ? qui fait la tâche ?</p>`,
'Résultat vs outil':`<p>Ne vends pas « un workflow n8n ». Vends un résultat : réduire le délai de réponse, éviter des oublis, accélérer la qualification ou automatiser un reporting. L’outil est une partie de la solution.</p>`,
'Audit d’automatisation':`<p>Un audit observe le processus actuel, les entrées, les applications, les règles, les exceptions et le coût du problème. Il se termine par des priorités : automatiser maintenant, simplifier d’abord, ou ne pas automatiser.</p>`,
'Construire une liste':`<p>Une liste de prospects doit être qualifiée : secteur, taille, zone, décideur, problème potentiel, signal observé et moyen de contact. La qualité compte plus que remplir un tableur de centaines de noms.</p>`,
'Appel découverte':`<p>Un bon appel cherche d’abord à comprendre : processus actuel, volume, coût, outils, blocages, urgence et décision. Ne saute pas directement à la démonstration.</p>`,
'Démo et objections':`<p>Montre le problème avant la solution. Une démo efficace raconte : avant → intervention → après. Prépare les objections sur sécurité, fiabilité, coût, changement d’habitudes et maintenance.</p>`,
'Cadrage':`<p>Avant de construire, définis objectif, périmètre, données, applications, utilisateurs, contraintes, critères de réussite et exclusions. Un bon cadrage évite une grande partie des malentendus.</p>`,
'Tests et sécurité':`<p>Teste le chemin normal, les données manquantes, les doublons, les erreurs API, les délais, les permissions et les cas limites. Ne mets jamais de secrets dans le code public et limite les accès au nécessaire.</p>`,
'Diagnostic d’entreprise':`<p>Le diagnostic final doit partir d’un processus réel. Tu dois identifier le problème, proposer une solution proportionnée, expliquer l’architecture, les risques, la valeur et le plan de déploiement.</p>`
};
const quizMap={'Automatisation vs IA':['Quelle approche est préférable quand une règle simple suffit ?',['Un agent IA','Une règle déterministe','Un RAG','Un LLM sans contexte'],1],'API : comprendre une requête':['Quel élément permet généralement de distinguer une lecture d’une création dans une API HTTP ?',['Le logo','La méthode HTTP','La couleur du bouton','Le nom du CRM'],1],'Webhooks':['Quel est le rôle principal d’un webhook ?',['Stocker un mot de passe','Notifier une URL lorsqu’un événement survient','Créer un modèle IA','Remplacer un CRM'],1],'LLM et tokens':['Que désigne principalement un token pour un LLM ?',['Une unité de texte traitée par le modèle','Un compte bancaire','Un webhook','Une base SQL'],0],'Workflow vs agent':['Pourquoi préférer un workflow déterministe quand il suffit ?',['Il est généralement plus prévisible','Il coûte toujours plus cher','Il ne peut jamais échouer','Il remplace toutes les APIs'],0],'RAG':['Que fait principalement un système RAG avant la génération ?',['Il supprime le contexte','Il récupère des informations pertinentes','Il désactive le modèle','Il transforme tout en image'],1],'Résultat vs outil':['Que doit acheter réellement un client ?',['Un nom de logiciel','Un résultat ou une amélioration utile','Le plus de nodes possible','Un abonnement IA sans objectif'],1]};
function total(){return mods.reduce((n,m)=>n+m[5].length,0)}function isDone(k){return S.done.includes(k)}function key(mi,li){return mi+'-'+li}function progress(){return Math.round(S.done.length/total()*100)}
function nav(p){document.querySelectorAll('.navlinks button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({home,course,practice,business,glossary:glossaryPage,resources}[p]||home)(document.getElementById('app'))}
document.querySelectorAll('.navlinks button').forEach(b=>b.onclick=()=>nav(b.dataset.p));
function home(a){a.innerHTML=`<section class="hero"><span class="badge" style="background:#ffffff22;color:#fff">V2 · PARCOURS COMPLET</span><h1>Apprendre l’automatisation IA comme un vrai métier.</h1><p>Une progression en 12 niveaux : concepts → outils → technique → IA → systèmes métier → niche → offre → prospection → projet client. Chaque leçon mélange théorie, visuel, exercice et validation.</p><div class="bar"><i style="width:${progress()}%"></i></div><p style="margin:7px 0 0">${S.done.length}/${total()} leçons validées · ${progress()}% · ${S.xp} XP</p><div class="stats"><div class="stat"><b>12</b><span>niveaux</span></div><div class="stat"><b>${total()}</b><span>leçons</span></div><div class="stat"><b>6</b><span>types de compétences</span></div><div class="stat"><b>1</b><span>projet final</span></div></div></section><div class="section"><div class="grid"><div class="card"><span class="badge">Méthode</span><h3>Théorie → pratique → validation</h3><p class="muted">Tu ne dois pas seulement reconnaître un terme : tu dois pouvoir l’expliquer, l’utiliser et repérer quand il apporte de la valeur.</p></div><div class="card"><span class="badge">Business</span><h3>Problème → solution → valeur</h3><p class="muted">Le programme t’apprend à vendre un résultat, pas à réciter une liste d’outils.</p></div><div class="card"><span class="badge">Progression</span><h3>Pas d’agent IA au jour 1</h3><p class="muted">Les systèmes avancés arrivent après les fondations, les APIs, les données et les workflows fiables.</p></div></div></div><div class="section"><h2>Par où commencer ?</h2><p class="muted">Commence par le niveau 01 et avance dans l’ordre.</p><button class="btn" onclick="nav('course')">Commencer le niveau 01 →</button></div>`}
function course(a){a.innerHTML=`<h2>Parcours A → Z</h2><p class="muted">Les niveaux sont volontairement progressifs. Ouvre une carte pour voir les leçons.</p><div class="grid">${mods.map((m,i)=>`<div class="card module ${i>0&&!isDone(key(i-1,m[5].length-1))?'locked':''}"><span class="badge">${m[2]}</span><span class="num">${m[0]}</span><h3>${m[1]}</h3><p class="muted">${m[3]}</p><p class="small">${m[5].length} leçons · ${m[5].filter((_,j)=>isDone(key(i,j))).length}/${m[5].length}</p><button class="btn" onclick="openModule(${i})">Ouvrir</button></div>`).join('')}</div>`}
function openModule(mi){const m=mods[mi],a=document.getElementById('app');a.innerHTML=`<button class="btn secondary" onclick="nav('course')">← Parcours</button><div class="section"><span class="badge">Niveau ${m[0]} · ${m[2]}</span><h2>${m[1]}</h2><p class="muted">${m[3]}</p></div><div class="grid">${m[5].map((t,j)=>`<div class="card"><span class="pill">Leçon ${j+1}</span><h3>${t}</h3><p class="small ${isDone(key(mi,j))?'done':''}">${isDone(key(mi,j))?'✓ Validée':'À apprendre'}</p><button class="btn ${isDone(key(mi,j))?'secondary':''}" onclick="openLesson(${mi},${j})">${isDone(key(mi,j))?'Revoir':'Commencer'}</button></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>🎯 Validation du niveau</h3><p class="muted">Quand toutes les leçons sont validées, fais un mini-cas avec moi ici dans la conversation : je te donnerai un scénario et j’évaluerai ton raisonnement.</p></div>`}
function visualFor(title){let map={'Automatisation vs IA':['Règle','Workflow','IA si ambiguïté','Résultat'],'Workflow, trigger et action':['Trigger','Données','Décision','Action','Résultat'],'API : comprendre une requête':['Client','Requête HTTP','API','Réponse'],'Webhooks':['Événement','Webhook','Workflow'],'Tool calling':['Agent','Tool call','Outil','Résultat'],'RAG':['Question','Recherche','Contexte','LLM','Réponse'],'Lead management':['Lead','Qualification','CRM','Commercial'],'Appel découverte':['Prospect','Questions','Diagnostic','Proposition']};let x=map[title];return x?`<div class="visual"><div class="flow">${x.map((v,i)=>`<span class="box">${v}</span>${i<x.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><div class="caption">Schéma mental de la notion.</div></div>`:''}
function openLesson(mi,li){const m=mods[mi],title=m[5][li],a=document.getElementById('app');let text=detail[title]||`<p>Cette leçon te fait travailler <b>${title.toLowerCase()}</b> dans le contexte de l’automatisation IA.</p><div class="concept"><b>Objectif :</b> savoir expliquer la notion simplement, reconnaître quand l’utiliser et l’intégrer dans un workflow.</div><h3>Comment raisonner</h3><p>Commence toujours par le problème métier. Identifie les données d’entrée, les règles, les exceptions, les actions attendues et le résultat. Ensuite seulement choisis l’outil.</p><h3>Exercice</h3><p>Prends une entreprise fictive et imagine un cas où cette notion lui ferait gagner du temps. Écris le déclencheur, les données, les actions et le résultat attendu.</p>`;let q=quizMap[title];a.innerHTML=`<div class="side"><aside class="card toc"><b>${m[1]}</b>${m[5].map((x,j)=>`<button onclick="openLesson(${mi},${j})">${j+1}. ${x}</button>`).join('')}</aside><article class="card lesson"><span class="badge">${m[2]} · Leçon ${li+1}/${m[5].length}</span><h2>${title}</h2><h3>🎯 Objectif</h3><p>À la fin, tu dois pouvoir expliquer cette notion avec tes propres mots, l’identifier dans un système et savoir pourquoi elle est utile.</p>${visualFor(title)}${text}<h3>⚠️ Erreur de débutant à éviter</h3><p class="warning">Ne confonds pas l’outil et le problème. Une automatisation n’est pas bonne parce qu’elle utilise n8n, Make ou un agent : elle est bonne parce qu’elle résout correctement un besoin.</p>${q?quiz(title,q):''}${openAnswer(title)}<div class="actions"><button class="btn" onclick="complete(${mi},${li})">${isDone(key(mi,li))?'✓ Leçon validée':'Valider la leçon'}</button><button class="btn secondary" onclick="openModule(${mi})">Retour au niveau</button></div></article></div>`;scrollTo(0,0)}
function quiz(title,q){return `<div class="quiz"><h3>🧠 Vérifie tes connaissances</h3><p><b>${q[0]}</b></p>${q[1].map((o,i)=>`<button class="opt" onclick="answerQuiz(this,'${title.replaceAll("'","\\'")}',${i},${q[2]})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="qfb" class="feedback"></div></div>`}
function answerQuiz(el,title,i,c){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);let fb=document.getElementById('qfb');if(i===c){el.classList.add('good');fb.textContent='✓ Bonne réponse. Tu as identifié le principe essentiel.';fb.style.color='var(--good)';S.xp+=10}else{el.classList.add('bad');document.querySelectorAll('.opt')[c].classList.add('good');fb.textContent='Pas tout à fait. Relis la définition et regarde pourquoi la réponse mise en évidence correspond au problème.';fb.style.color='var(--bad)'}save()}
function openAnswer(title){return `<div class="open"><h3>✍️ Réponse écrite</h3><p>Explique la notion avec tes propres mots. Le correcteur vérifie des idées essentielles, puis te donne une piste de correction.</p><textarea id="oa" placeholder="Écris ta réponse ici..."></textarea><button class="btn" style="margin-top:9px" onclick="gradeOpen('${title.replaceAll("'","\\'")}')">Corriger ma réponse</button><div id="ofb" style="margin-top:12px"></div></div>`}
function gradeOpen(title){let v=(document.getElementById('oa').value||'').toLowerCase(),words=title.toLowerCase().split(/[^a-zà-ÿ0-9]+/).filter(x=>x.length>3),found=words.filter(w=>v.includes(w)),score=Math.min(10,Math.round(10*found.length/Math.max(2,words.length)));let fb=document.getElementById('ofb');if(!v.trim()){fb.textContent='Écris d’abord ta réponse.';return}fb.innerHTML=`<div class="score">${score}/10</div><p>${score>=7?'Bonne base : tu as repris plusieurs éléments attendus.':'Il manque encore des éléments essentiels. Reprends l’objectif, le fonctionnement et un exemple concret.'}</p><p class="muted">Important : cette correction locale est indicative. Pour une correction complète du raisonnement, tu peux me donner ta réponse ici et je la corrigerai en détail.</p>`;S.xp+=score;save()}
function complete(mi,li){if(!isDone(key(mi,li))){S.done.push(key(mi,li));S.xp+=20;save()}openModule(mi)}
function practice(a){let ex=[['Workflow sur papier','Choisis une tâche répétitive et écris trigger → données → traitement → action → résultat.'],['Détective API','Prends une API publique et repère endpoint, méthode, authentification et réponse JSON.'],['Décision IA','Liste 5 tâches et décide : règle, IA ou humain. Justifie chaque choix.'],['Mini audit','Choisis une entreprise fictive et liste 3 processus qui pourraient être améliorés.'],['ROI','Estime temps gagné × coût horaire et compare au coût de mise en place.'],['Pitch','Explique une automatisation en 30 secondes sans prononcer le nom d’un outil.']];a.innerHTML=`<h2>🧪 Laboratoire pratique</h2><p class="muted">Ces exercices complètent les cours. Fais-les avant de chercher un nouveau logiciel.</p><div class="grid">${ex.map((e,i)=>`<div class="card"><span class="badge">Mission ${i+1}</span><h3>${e[0]}</h3><p>${e[1]}</p><textarea id="p${i}" class="search" style="min-height:110px" placeholder="Ta réponse..."></textarea><button class="btn" style="margin-top:8px" onclick="savePractice(${i})">Sauvegarder</button></div>`).join('')}</div>`}
function savePractice(i){let el=document.getElementById('p'+i);S.answers['p'+i]=el.value;S.xp+=5;save();alert('Réponse sauvegardée sur cet appareil.')}
function business(a){let cases=[['Immobilier','Demandes entrantes, qualification, relances, rendez-vous'],['Artisans / PME locales','Demandes de devis, suivi, relances'],['E-commerce','Tri des emails, FAQ, suivi de commandes'],['Agences','Reporting, collecte, briefs, suivi client'],['Services B2B','Qualification, prise de rendez-vous, CRM']];a.innerHTML=`<h2>💼 Business Lab</h2><p class="muted">Ici, tu apprends à trouver des problèmes qui valent potentiellement de l’argent. Ce ne sont pas des niches garanties : tu dois les valider auprès du terrain.</p><div class="card"><h3>La grille de sélection</h3><table class="table"><tr><th>Critère</th><th>Question</th></tr><tr><td>Fréquence</td><td>Combien de fois par semaine ?</td></tr><tr><td>Temps</td><td>Combien d’heures sont perdues ?</td></tr><tr><td>Coût</td><td>Quel est le coût du problème ou de l’erreur ?</td></tr><tr><td>Accès</td><td>Peux-tu parler au décideur ?</td></tr><tr><td>Mesure</td><td>Peut-on démontrer une amélioration ?</td></tr></table></div><div class="grid" style="margin-top:14px">${cases.map(c=>`<div class="card"><span class="badge">Piste à tester</span><h3>${c[0]}</h3><p>${c[1]}</p><div class="concept">Question de découverte : « Comment gérez-vous cette tâche aujourd’hui et combien de temps cela vous prend ? »</div></div>`).join('')}</div>`}
function glossaryPage(a){a.innerHTML=`<h2>📖 Glossaire</h2><p class="muted">Les termes à connaître. Cherche quand un mot bloque ta compréhension.</p><input class="search" id="gs" placeholder="API, webhook, JSON, agent..." oninput="filterG()"><div id="terms">${[['API','Interface de communication entre logiciels.'],['Webhook','Notification envoyée à une URL lorsqu’un événement survient.'],['JSON','Format structuré de données.'],['Trigger','Événement qui démarre un workflow.'],['Node','Étape d’un workflow n8n.'],['LLM','Modèle de langage à grande échelle.'],['Prompt','Instruction et contexte donnés à un modèle.'],['Agent IA','Système capable d’utiliser un modèle et des outils pour atteindre un objectif.'],['RAG','Récupération de données pertinentes avant génération.'],['Tool calling','Mécanisme permettant à un modèle de demander l’exécution d’un outil.'],['CRM','Outil de gestion des prospects et clients.'],['OAuth','Protocole courant d’autorisation déléguée.'],['CRUD','Create, Read, Update, Delete : opérations fondamentales sur des données.'],['Idempotence','Propriété d’une opération répétée qui évite les effets indésirables.'],['MVP','Version minimale pour tester une solution.'],['ROI','Retour sur investissement.'],['Lead','Prospect potentiel.'],['Pipeline','Étapes de progression d’une opportunité commerciale.']].map(x=>`<div class="term"><b>${x[0]}</b><div class="muted">${x[1]}</div></div>`).join('')}</div>`}function filterG(){let q=document.getElementById('gs').value.toLowerCase();document.querySelectorAll('.term').forEach(x=>x.classList.toggle('hide',!x.textContent.toLowerCase().includes(q)))}
function resources(a){a.innerHTML=`<h2>🔗 Ressources de référence</h2><p class="muted">Le site est ton parcours. Les documentations officielles restent la source de vérité quand les interfaces évoluent.</p><div class="grid"><div class="card"><span class="badge">Make</span><h3>Make Academy</h3><p>Parcours officiels avec pratique, évaluations et progression par niveaux.</p><a class="btn" href="https://academy.make.com/" target="_blank">Ouvrir</a></div><div class="card"><span class="badge">n8n</span><h3>Documentation n8n</h3><p>Référence technique pour workflows, nodes, credentials et intégrations.</p><a class="btn" href="https://docs.n8n.io/" target="_blank">Ouvrir</a></div><div class="card"><span class="badge">À utiliser avec recul</span><h3>Communautés</h3><p>Les retours terrain sont utiles pour trouver des problèmes et des erreurs fréquentes, mais vérifie les informations techniques dans la documentation officielle.</p></div></div>`}
nav('home');
</script>
